name: ur_real

services:
  ros2:
    build: .
    image: docker-ros2
    container_name: david_docker_real
    network_mode: host              # robots connect back on 50001-50008
    volumes:
      - ..:/ros2_ws
      - /tmp/.X11-unix:/tmp/.X11-unix
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - LIBGL_ALWAYS_SOFTWARE=1
      - ROS_DOMAIN_ID=1 
      - ROS_STATIC_PEERS=192.168.0.200
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp          # keep separate from the sim container's ROS graph
    stdin_open: true
    tty: true
