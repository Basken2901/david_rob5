name: ur_real

services:
  ros2:
    build: .
    image: docker-ros2
    container_name: david_docker_real
    network_mode: host              # robots connect back on 50001-50008
    volumes:
      - ..:/ros2_ws
      - /tmp/.X11-unix:/tmp/.X11-unix
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - ROS_DOMAIN_ID=1             # Isaac must use the same
    cap_add:
      - SYS_NICE
    ulimits:
      rtprio: 99
      memlock: -1
    stdin_open: true
    tty: true