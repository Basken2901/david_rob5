controller_manager:
  ros__parameters:
    update_rate: 500

    #----- Shared publisher for all 12 joints -----
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    #--- UR status for both arms----
    left_io_and_status_controller:
      type: ur_controllers/GPIOController
    right_io_and_status_controller:
      type: ur_controllers/GPIOController
    left_speed_scaling_state_broadcaster:
      type: ur_controllers/SpeedScalingStateBroadcaster
    right_speed_scaling_state_broadcaster:
      type: ur_controllers/SpeedScalingStateBroadcaster

    #------What to publish to ---
    left_forward_velocity_controller:
      type: forward_command_controller/ForwardCommandController
    right_forward_velocity_controller:
      type: forward_command_controller/ForwardCommandController


left_io_and_status_controller:
  ros__parameters:
    tf_prefix: "left_"
right_io_and_status_controller:
  ros__parameters:
    tf_prefix: "right_"

left_speed_scaling_state_broadcaster:
  ros__parameters:
    state_publish_rate: 100.0
    tf_prefix: "left_"
right_speed_scaling_state_broadcaster:
  ros__parameters:
    state_publish_rate: 100.0
    tf_prefix: "right_"


#-----------Velocity controllers-----------
left_forward_velocity_controller:
  ros__parameters:
    joints:
      - left_shoulder_pan_joint
      - left_shoulder_lift_joint
      - left_elbow_joint
      - left_wrist_1_joint
      - left_wrist_2_joint
      - left_wrist_3_joint
    interface_name: velocity

right_forward_velocity_controller:
  ros__parameters:
    joints:
      - right_shoulder_pan_joint
      - right_shoulder_lift_joint
      - right_elbow_joint
      - right_wrist_1_joint
      - right_wrist_2_joint
      - right_wrist_3_joint
    interface_name: velocity